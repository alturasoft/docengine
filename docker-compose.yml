services:
  docengine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docengine_api
    ports:
      - "8000:8000"
    volumes:
      # Persist extracted documents
      - ./outputs:/app/outputs
      # Read-only samples for testing
      - ./samples:/app/samples:ro
      # Insurance company extraction skills & rules
      - ./skills:/app/skills:ro
      # Agent rules and guidelines
      - ./.agents:/app/.agents:ro
      # Web UI static files
      - ./webui:/app/webui:ro
      # Application code
      - ./app:/app/app:ro
      - ./main.py:/app/main.py:ro
      # HuggingFace cache named volume
      - hf_cache:/tmp/huggingface
      # Scripts
      - ./scripts:/app/scripts:ro
      # Optional: pre-downloaded Docling model artifacts
      # - ./docling_models:/app/docling_models:ro
    env_file:
      - .env
    environment:
      - DOCENGINE_ENV=development
      - DOCENGINE_LOG_LEVEL=INFO
      - DOCENGINE_LOG_FORMAT=json
      - DOCENGINE_EXTRACTION_DO_OCR=false
      - DOCENGINE_EXTRACTION_TABLE_MODE=ACCURATE
      - DOCENGINE_OUTPUT_OUTPUT_DIR=/app/outputs
      - DOCENGINE_DB_HOST=postgres_db
      - DOCENGINE_DB_PORT=5432
      - DOCENGINE_DB_NAME=docengine
      - DOCENGINE_DB_USER=postgres
      - DOCENGINE_DB_PASSWORD=postgres
      - HF_HOME=/tmp/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TORCH_COMPILE_DISABLE=1
      # Uncomment to use pre-downloaded models (air-gapped environments):
      # - DOCENGINE_PIPELINE_ARTIFACTS_PATH=/app/docling_models
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - docengine_net

  postgres_db:
    image: pgvector/pgvector:pg16
    container_name: docengine_postgres
    environment:
      - POSTGRES_DB=docengine
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/001_add_rag_tables.sql:/docker-entrypoint-initdb.d/001_add_rag_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docengine"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docengine_net

volumes:
  postgres_data:
  hf_cache:

networks:
  docengine_net:
    driver: bridge

