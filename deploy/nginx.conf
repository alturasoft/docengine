# ==============================================================================
# DocEngine — Nginx Reverse Proxy (Production TLS)
# Copy to /etc/nginx/conf.d/docengine.conf (RHEL/Rocky) or
# /etc/nginx/sites-available/docengine.conf (Debian/Ubuntu)
# ==============================================================================

upstream docengine_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name docengine.example.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docengine.example.com;

    # --- TLS Certificates (update paths for your server) ---
    ssl_certificate     /etc/ssl/certs/docengine.crt;
    ssl_certificate_key /etc/ssl/private/docengine.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Upload & Timeout Limits (aligned with DOCENGINE_PERF_MAX_UPLOAD_SIZE_MB & 600s timeout) ---
    client_max_body_size 500M;
    client_body_timeout  600s;

    location / {
        proxy_pass http://docengine_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Healthcheck endpoint without access log noise
    location = /api/v1/health {
        proxy_pass http://docengine_backend;
        access_log off;
    }
}
